    <!-- Aplica o tema salvo antes da página aparecer, para não piscar. Padrão: escuro. -->
    <script>
      try {
        if (localStorage.getItem('tema') === 'claro') {
          document.documentElement.classList.remove('dark')
        } else {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
